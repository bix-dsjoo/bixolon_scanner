__include__:
  - ./dfine_bread_0.1.2_multi_only_fold0.yml

output_dir: artifacts/experiments/bread-0.1.2-multi-only-detector/fold0/training-classaware-highlr

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    - params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.0
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

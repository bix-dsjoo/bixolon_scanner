__include__:
  - ./dfine_bread_0.1.2_detector415_final_all.yml

# Continue the exact 0.1.1 production training state at epoch 28. The resume
# checkpoint restores optimizer, EMA and scheduler state; this overlay changes
# only the 415-image development data and the final epoch boundary.
output_dir: artifacts/experiments/bread-0.1.2-detector415/resume-production/training
epochs: 34
checkpoint_freq: 1

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: true}
  collate_fn:
    stop_epoch: 34
    ema_restart_decay: 0.9999
    base_size_repeat: null

__include__:
  - ../../../artifacts/third_party/D-FINE/configs/dfine/dfine_hgnetv2_s_coco.yml

# Iteration 3 fallback: match the deployed YOLO detector's one-class objectness
# contract while retaining Apache-2.0 D-FINE/HGNetv2 components. Start from the
# official Apache-2.0 D-FINE-S COCO checkpoint and select only on diagnostics.
output_dir: artifacts/experiments/yolo-free-0.1.7/detector/dfine-s-objectness/training
num_classes: 1
remap_mscoco_category: false
eval_spatial_size: [640, 640]
epochs: 12
checkpoint_freq: 1

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 5

ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 20
  start: 0

train_dataloader:
  total_batch_size: 8
  num_workers: 4
  persistent_workers: true
  dataset:
    img_folder: datasets/bread_dataset
    ann_file: artifacts/experiments/yolo-free-0.1.7/detector/all415/coco-objectness/instances_all.json
    transforms:
      policy:
        epoch: 10
  collate_fn:
    stop_epoch: 10
    ema_restart_decay: 0.9999
    base_size_repeat: null

val_dataloader:
  total_batch_size: 8
  num_workers: 4
  persistent_workers: true
  dataset:
    img_folder: datasets/bread_dataset
    ann_file: artifacts/experiments/yolo-free-0.1.7/detector/all415/coco-objectness/instances_all.json

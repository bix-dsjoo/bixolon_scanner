__include__:
  - ../../../artifacts/vendor/D-FINE/configs/dfine/dfine_hgnetv2_n_coco.yml

output_dir: artifacts/experiments/bread-0.1.2-multi-only-detector/fold0/training-objectness-seed0
num_classes: 1
remap_mscoco_category: false
eval_spatial_size: [640, 640]
epochs: 40
checkpoint_freq: 1

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 50

ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 100
  start: 0

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00001
    - params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00001
      weight_decay: 0.0
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  total_batch_size: 8
  num_workers: 4
  persistent_workers: true
  dataset:
    img_folder: datasets/bread_dataset
    ann_file: artifacts/experiments/bread-0.1.2-multi-only-detector/fold0/coco-objectness/instances_train.json
    transforms:
      policy:
        epoch: 30
  collate_fn:
    stop_epoch: 30
    ema_restart_decay: 0.9999
    base_size_repeat: null

val_dataloader:
  total_batch_size: 8
  num_workers: 4
  persistent_workers: true
  dataset:
    img_folder: datasets/bread_dataset
    ann_file: artifacts/experiments/bread-0.1.2-multi-only-detector/fold0/coco-objectness/instances_validation.json

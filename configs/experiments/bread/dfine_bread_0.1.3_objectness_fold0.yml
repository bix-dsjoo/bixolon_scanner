__include__:
  - ../../../artifacts/vendor/D-FINE/configs/dfine/dfine_hgnetv2_n_coco.yml

# Product-independent detector: the deployed head has one bread-object output.
output_dir: artifacts/experiments/bread-0.1.3/detector/fold0/training
num_classes: 1
remap_mscoco_category: false
eval_spatial_size: [640, 640]
epochs: 12
checkpoint_freq: 1

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 2

ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 20
  start: 0

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000001
    - params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.000001
      weight_decay: 0.0
    - params: '^(?=.*score_head)(?!.*bias).*$'
      lr: 0.0002
    - params: '^(?=.*score_head)(?=.*bias).*$'
      lr: 0.0002
      weight_decay: 0.0
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias))(?!.*score_head).*$'
      weight_decay: 0.0
  lr: 0.00001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  total_batch_size: 8
  num_workers: 4
  persistent_workers: true
  dataset:
    img_folder: datasets/bread_dataset
    ann_file: artifacts/experiments/bread-0.1.3/detector/fold0/coco-objectness/instances_train.json
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.35}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: true}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: true}
      policy:
        name: stop_epoch
        epoch: 10
        ops: [RandomPhotometricDistort]
  collate_fn:
    stop_epoch: 10
    ema_restart_decay: 0.9999
    base_size_repeat: null

val_dataloader:
  total_batch_size: 8
  num_workers: 4
  persistent_workers: true
  dataset:
    img_folder: datasets/bread_dataset
    ann_file: artifacts/experiments/bread-0.1.3/detector/fold0/coco-objectness/instances_validation.json

__include__:
  - ../../../artifacts/third_party/D-FINE/configs/dfine/dfine_hgnetv2_n_coco.yml

# Development-set challenger trained on the same canonical 300-image scope used
# by the 0.1.7 comparison. The 2026-08-27 operational collection remains unseen.
output_dir: artifacts/experiments/yolo-free-0.1.7/detector/all/training-canonical300
num_classes: 20
remap_mscoco_category: false
eval_spatial_size: [640, 640]
epochs: 15
checkpoint_freq: 1

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 10

ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 20
  start: 0

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000001
    - params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.000001
      weight_decay: 0.0
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  lr: 0.00001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  total_batch_size: 8
  num_workers: 4
  persistent_workers: true
  dataset:
    img_folder: datasets/bread_dataset
    ann_file: artifacts/experiments/yolo-free-0.1.7/detector/fold0/coco-class-aware/instances_all.json
    transforms:
      policy:
        epoch: 12
  collate_fn:
    stop_epoch: 12
    ema_restart_decay: 0.9999
    base_size_repeat: null

val_dataloader:
  total_batch_size: 8
  num_workers: 4
  persistent_workers: true
  dataset:
    img_folder: datasets/bread_dataset
    ann_file: artifacts/experiments/yolo-free-0.1.7/detector/fold0/coco-class-aware/instances_all.json

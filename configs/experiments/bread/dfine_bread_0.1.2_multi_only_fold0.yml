__include__:
  - ../../../artifacts/vendor/D-FINE/configs/dfine/dfine_hgnetv2_n_coco.yml

output_dir: artifacts/experiments/bread-0.1.2-multi-only-detector/fold0/training-persistent
num_classes: 20
remap_mscoco_category: false
eval_spatial_size: [640, 640]
epochs: 30
checkpoint_freq: 1

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 5

ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 20
  start: 0

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00001
    - params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00001
      weight_decay: 0.0
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  total_batch_size: 16
  num_workers: 4
  persistent_workers: true
  dataset:
    img_folder: datasets/bread_dataset
    ann_file: artifacts/experiments/bread-0.1.2-multi-only-detector/fold0/coco/instances_train.json
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: true}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: true}
      policy:
        name: stop_epoch
        epoch: 20
        ops: [RandomPhotometricDistort]
  collate_fn:
    stop_epoch: 20
    ema_restart_decay: 0.9999
    base_size_repeat: null

val_dataloader:
  total_batch_size: 16
  num_workers: 4
  persistent_workers: true
  dataset:
    img_folder: datasets/bread_dataset
    ann_file: artifacts/experiments/bread-0.1.2-multi-only-detector/fold0/coco/instances_validation.json

name: bakery_scanner_lite
description: Read-only BIXOLON scan and operational log application.
publish_to: none
version: 0.1.17+20
environment:
  sdk: ^3.12.2
dependencies:
  archive: 4.0.9
  flutter:
    sdk: flutter
  camera: 0.12.0+2
  camera_windows: 0.2.6+4
  file_selector: ^1.1.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  path_provider: ^2.1.6
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/bixolon_logo.svg
    - assets/fonts/OFL.txt
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
